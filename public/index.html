<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영도중앙교회 AI 안내</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#183438;background:#edf5f4}
.shell{max-width:720px;margin:28px auto;padding:0 14px}.app{height:min(820px,calc(100vh - 56px));min-height:620px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(21,62,62,.14);display:flex;flex-direction:column}
.header{padding:27px 25px 23px;background:linear-gradient(135deg,#087e82,#11999b);color:white}.eyebrow{font-size:13px;opacity:.9;margin-bottom:7px}.header h1{font-size:28px;margin:0 0 7px}.header p{margin:0;font-size:14px;opacity:.94}
.chat{flex:1;overflow:auto;padding:22px;background:linear-gradient(#fbfdfd,#f7fbfa)}.row{display:flex;margin-bottom:13px}.row.user{justify-content:flex-end}.bubble{max-width:84%;padding:13px 16px;border-radius:18px;line-height:1.65;font-size:15px;white-space:pre-wrap;word-break:keep-all}.bot .bubble{background:#eaf2f1;border-bottom-left-radius:6px}.user .bubble{background:#0b8d90;color:#fff;border-bottom-right-radius:6px}
.quick{padding:12px 18px 7px;display:flex;gap:7px;overflow-x:auto;white-space:nowrap;border-top:1px solid #edf1f0}.quick button{flex:0 0 auto;border:1px solid #72b9b8;background:#fff;color:#087b7e;border-radius:20px;padding:8px 12px;cursor:pointer}
.entry{display:flex;gap:9px;padding:10px 18px 17px}.entry input{min-width:0;flex:1;border:1px solid #cedad8;border-radius:23px;padding:13px 16px;font-size:16px;outline:none}.entry input:focus{border-color:#0b8d90}.entry button{border:0;background:#0b8d90;color:#fff;border-radius:23px;padding:0 20px;font-weight:700;cursor:pointer}.entry button:disabled{opacity:.55}
.footer{padding:0 20px 16px;color:#788886;font-size:11px;line-height:1.5;text-align:center}
@media(max-width:600px){.shell{margin:0;padding:0}.app{height:100dvh;min-height:0;border-radius:0}.header{padding-top:max(23px,env(safe-area-inset-top))}.header h1{font-size:24px}.bubble{max-width:90%}}
</style></head>
<body><main class="shell"><section class="app">
<header class="header"><div class="eyebrow">예수님과 동행하는 111공동체</div><h1>영도중앙교회 AI 안내</h1><p>교회에 대해 궁금한 내용을 편하게 물어보세요.</p></header>
<div id="chat" class="chat"><div class="row bot"><div class="bubble">안녕하세요. 영도중앙교회 AI 안내입니다.
예배시간, 오시는 길, 주차, 교회 안내 등을 물어보세요.</div></div></div>
<div class="quick">
<button data-q="주일예배 시간 알려주세요">예배시간</button><button data-q="교회 주소와 오시는 길 알려주세요">오시는 길</button><button data-q="주차장은 어디에 있나요?">주차안내</button><button data-q="교회 전화번호 알려주세요">전화번호</button><button data-q="담임목사님은 누구인가요?">담임목사</button>
</div>
<form id="form" class="entry"><input id="input" maxlength="1000" autocomplete="off" placeholder="질문을 입력하세요"><button id="send">보내기</button></form>
<div class="footer">AI 안내는 등록된 교회 자료를 기준으로 답변합니다. 중요한 일정은 교회에 다시 확인해 주세요.</div>
</section></main>
<script>
const chat=document.getElementById("chat"),input=document.getElementById("input"),form=document.getElementById("form"),send=document.getElementById("send");
let history=[];
function bubble(text,who){const r=document.createElement("div");r.className="row "+who;const b=document.createElement("div");b.className="bubble";b.textContent=text;r.appendChild(b);chat.appendChild(r);chat.scrollTop=chat.scrollHeight;return b}
async function ask(q){q=(q||"").trim();if(!q||send.disabled)return;bubble(q,"user");history.push({role:"user",content:q});history=history.slice(-10);input.value="";send.disabled=true;const wait=bubble("답변을 준비하고 있습니다…","bot");
try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});const j=await r.json();const answer=j.answer||j.error||"오류가 발생했습니다.";wait.textContent=answer;if(j.answer){history.push({role:"assistant",content:answer});history=history.slice(-10)}}catch(e){wait.textContent="서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요."}finally{send.disabled=false;input.focus()}}
form.addEventListener("submit",e=>{e.preventDefault();ask(input.value)});document.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>ask(b.dataset.q)));
</script></body></html>
